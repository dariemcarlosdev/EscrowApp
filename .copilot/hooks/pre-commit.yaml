# Copilot CLI Pre-Commit Hook Configuration
# Defines how Copilot CLI should automatically trigger pre-commit validation
# Automatically triggered on git commit when configured in Copilot CLI settings

trigger: git-commit
environment: copilot-cli
portable: true
sync-with: .github/hooks/pre-commit

---

# This configuration tells Copilot CLI to:
# 1. Intercept git commit operations
# 2. Run security validation BEFORE commit is created
# 3. Block commits with CRITICAL issues
# 4. Provide terminal feedback

# Configuration is read by:
# - Copilot CLI runtime (when available)
# - Copilot CLI extensions system
# - Manual trigger via `copilot pre_commit_security_scan` command

# Security checks (mirrors .github/hooks/pre-commit):
checks:
  - name: "NexSynapse IP Protection"
    patterns:
      - "^\.agent/"
      - "^\.claude/"
      - "^AGENTS\.md$"
      - "^\.github/skills/"
    severity: CRITICAL
    action: BLOCK
    
  - name: "Stripe Secret Keys"
    patterns:
      - "sk_(live|test)_[a-zA-Z0-9]{20,}"
    severity: CRITICAL
    action: BLOCK
    
  - name: "GitHub Tokens"
    patterns:
      - "(ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36,}"
    severity: CRITICAL
    action: BLOCK
    
  - name: "AWS Secret Keys"
    patterns:
      - "(aws_secret_access_key|AKIA)[a-zA-Z0-9/+=]{20,}"
    severity: CRITICAL
    action: BLOCK
    
  - name: "Hardcoded Passwords"
    patterns:
      - "(password|passwd|pwd)[\\s]*[:=][\\s]*['\"][^'\"]{4,}['\"]"
    severity: CRITICAL
    action: BLOCK
    
  - name: "Private Keys"
    patterns:
      - "BEGIN[\\s]+(RSA[\\s]+)?PRIVATE[\\s]+KEY"
    severity: CRITICAL
    action: BLOCK
    
  - name: "SQL Injection Patterns"
    patterns:
      - "FromSqlRaw|ExecuteSqlRaw"
    severity: HIGH
    action: WARN

# When triggered in Copilot CLI:
on_success:
  feedback: "✅ Pre-commit validation passed. Proceeding with commit."
  auto_proceed: true  # Copilot can auto-commit on CLI
  
on_failure:
  feedback: "⛔ COMMIT BLOCKED — CRITICAL security issues found."
  blocked_files: show
  remediation_hints: true
  allow_bypass: false  # NexSynapse IP files cannot be bypassed

# Integration points:
integrations:
  - type: "copilot-tool"
    trigger: "pre_commit_security_scan"
    description: "Built-in tool for pre-commit validation"
    
  - type: "copilot-extension"
    trigger: "Before git commit operation"
    description: "Extension hook auto-triggered on commit"
    
  - type: "copilot-mcp"
    trigger: "MCP resource: security-report"
    description: "Full OWASP audit report generation"

# Files to scan (same as .github/hooks/pre-commit):
scan_patterns:
  - "*.cs"
  - "*.razor"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - "*.xml"
  - "*.config"
  - "*.csproj"
  - ".env"

# Exclude from scan:
exclude_patterns:
  - ".github/extensions/pre-commit-guard/*"
  - ".github/extensions/security-scanner/*"
  - ".github/skills/security/*"
  - ".github/hooks/*"
  - ".claude/hooks/*"
  - "bin/"
  - "obj/"
  - ".vs/"

# Output format for Copilot CLI:
output:
  format: "terminal-structured"
  include_locations: true
  include_remediation: true
  include_severity: true
  use_colors: true
