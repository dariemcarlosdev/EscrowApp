name: AI Configuration Sync Validation
# Part of the NexSynapse portable AI infrastructure

on:
  pull_request:
    paths:
      - '.copilot/**'
      - '.claude/**'
      - '.agent/**'
      - '.codex/**'
      - '.gemini/**'
  push:
    branches: [ main, master ]
    paths:
      - '.copilot/**'
      - '.claude/**'
      - '.agent/**'
      - '.codex/**'
      - '.gemini/**'

env:
  # Allow workflow to check out NexSynapse sibling directory
  NEXSYNAPSE_ROOT: ${{ github.workspace }}/../NexSynapse

jobs:
  validate-ai-sync:
    name: Validate Portable AI Architecture Sync
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout project repository
      uses: actions/checkout@v4
      with:
        path: project
        
    - name: Checkout NexSynapse infrastructure
      uses: actions/checkout@v4
      with:
        repository: internal/nexsynapse  # Replace with your NexSynapse repo
        path: NexSynapse
        token: ${{ secrets.NEXSYNAPSE_TOKEN }}  # If private
        
    - name: Install dependencies
      run: |
        # Install jq for JSON validation
        sudo apt-get update && sudo apt-get install -y jq
        
        # Make sync script executable
        chmod +x NexSynapse/scripts/ai-config-sync.sh
        
    - name: Validate AI configuration sync
      working-directory: project
      run: |
        echo "🔄 Validating Portable AI Architecture compliance..."
        
        # Run NexSynapse sync validation in strict mode
        ../NexSynapse/scripts/ai-config-sync.sh "$(pwd)" --validate --strict
        
        echo "✅ Portable AI sync validation passed"
        
    - name: Check for sync drift
      working-directory: project  
      run: |
        echo "🔍 Checking for configuration drift..."
        
        # Perform dry-run sync to detect any missing translations
        ../NexSynapse/scripts/ai-config-sync.sh "$(pwd)" --sync --dry-run > sync_report.txt
        
        # Check if dry-run would make any changes
        if grep -q "Would sync" sync_report.txt; then
          echo "⚠️  Configuration drift detected:"
          cat sync_report.txt
          echo ""
          echo "💡 This indicates .copilot/ and .claude/ are out of sync."
          echo "   Run the sync script locally and commit the results."
          exit 1
        else
          echo "✅ No configuration drift detected"
        fi
        
    - name: Validate JSON syntax
      working-directory: project
      run: |
        echo "🔍 Validating JSON configuration files..."
        
        # Check Claude settings.json files
        find .claude -name "settings.json" -type f | while read -r file; do
          echo "Validating $file"
          if ! jq empty < "$file"; then
            echo "❌ Invalid JSON syntax in $file"
            exit 1
          fi
        done
        
        echo "✅ All JSON files are valid"
        
    - name: Security scan AI configurations  
      working-directory: project
      run: |
        echo "🛡️  Scanning AI configurations for secrets..."
        
        # Use NexSynapse security patterns
        if [ -f "../NexSynapse/templates/git-hooks/pre-commit" ]; then
          # Extract and run the secret scanning logic
          echo "Running security scan..."
          
          # Simple secret check on AI config files
          find .copilot .claude -type f \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) | while read -r file; do
            if grep -qE 'sk_(live|test)_[a-zA-Z0-9]{20,}' "$file" 2>/dev/null; then
              echo "❌ Secret found in $file"
              exit 1
            fi
          done
        fi
        
        echo "✅ No secrets detected in AI configurations"